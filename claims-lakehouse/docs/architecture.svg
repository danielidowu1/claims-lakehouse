<svg viewBox="0 0 760 740" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="darrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="740" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Claims Lakehouse — Architecture Flow</text>
  <text x="380" y="62" text-anchor="middle" font-size="12.5" fill="#64748b">Serverless medallion pipeline on AWS · orchestrated by GitHub Actions</text>

  <!-- LEFT: orchestration bar -->
  <rect x="24" y="176" width="108" height="360" rx="10" fill="#1f2328"/>
  <text transform="rotate(-90 78 356)" x="78" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">⚙  GitHub Actions</text>
  <text transform="rotate(-90 100 356)" x="100" y="356" text-anchor="middle" font-size="10.5" fill="#c9d1d9">CI on PRs · scheduled pipeline · OIDC</text>

  <!-- RIGHT: infra bar -->
  <rect x="628" y="266" width="108" height="270" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text transform="rotate(-90 682 401)" x="682" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">🟣  Terraform (IaC)</text>
  <text transform="rotate(-90 702 401)" x="702" y="401" text-anchor="middle" font-size="10.5" fill="#7c3aed">provisions S3 + Glue · Git version control</text>

  <!-- CENTER FLOW BOXES (x 250..510, width 260) -->
  <!-- 1. Source -->
  <rect x="250" y="86" width="260" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">CMS Synthetic Claims</text>
  <text x="380" y="128" text-anchor="middle" font-size="11.5" fill="#4f46e5">CSV / RIF  ·  download → data/raw</text>

  <line x1="380" y1="142" x2="380" y2="174" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="162" font-size="10.5" fill="#475569">ingest · Python + boto3</text>

  <!-- 2. Bronze -->
  <rect x="250" y="176" width="260" height="56" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">🟤  BRONZE</text>
  <text x="380" y="218" text-anchor="middle" font-size="11.5" fill="#9a3412">S3 · raw files, as-is + load metadata</text>

  <line x1="380" y1="232" x2="380" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="252" font-size="10.5" fill="#475569">clean · type · dedupe · conform</text>

  <!-- 3. Silver -->
  <rect x="250" y="266" width="260" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="380" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">⚪  SILVER</text>
  <text x="380" y="308" text-anchor="middle" font-size="11.5" fill="#475569">S3 · Parquet · standardized &amp; joined</text>

  <line x1="380" y1="322" x2="380" y2="354" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="342" font-size="10.5" fill="#475569">model · dimensional</text>

  <!-- 4. Gold -->
  <rect x="250" y="356" width="260" height="56" rx="10" fill="#fefce8" stroke="#b8860b" stroke-width="1.5"/>
  <text x="380" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">🟡  GOLD</text>
  <text x="380" y="398" text-anchor="middle" font-size="11.5" fill="#a16207">S3 · star schema · fact_claims + dim_*</text>

  <line x1="380" y1="412" x2="380" y2="444" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="432" font-size="10.5" fill="#475569">catalog</text>

  <!-- 5. Glue -->
  <rect x="250" y="446" width="260" height="56" rx="10" fill="#fff7ed" stroke="#ff9900" stroke-width="1.5"/>
  <text x="380" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">AWS Glue Data Catalog</text>
  <text x="380" y="488" text-anchor="middle" font-size="11.5" fill="#c2410c">table metadata for silver &amp; gold</text>

  <line x1="380" y1="502" x2="380" y2="534" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="522" font-size="10.5" fill="#475569">query · SQL</text>

  <!-- 6. Athena -->
  <rect x="250" y="536" width="260" height="56" rx="10" fill="#fff7ed" stroke="#ff9900" stroke-width="1.5"/>
  <text x="380" y="560" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Amazon Athena</text>
  <text x="380" y="578" text-anchor="middle" font-size="11.5" fill="#c2410c">serverless SQL over S3</text>

  <line x1="380" y1="592" x2="380" y2="624" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="612" font-size="10.5" fill="#475569">visualize</text>

  <!-- 7. Dashboard -->
  <rect x="250" y="626" width="260" height="56" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="650" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">📊  Streamlit Dashboard</text>
  <text x="380" y="668" text-anchor="middle" font-size="11.5" fill="#047857">answers the project objectives</text>

  <!-- dashed connectors: GH Actions -> pipeline stages -->
  <line x1="132" y1="204" x2="248" y2="204" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#darrow)"/>
  <line x1="132" y1="294" x2="248" y2="294" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#darrow)"/>
  <line x1="132" y1="384" x2="248" y2="384" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#darrow)"/>

  <!-- dashed connectors: Terraform -> S3/Glue -->
  <line x1="628" y1="294" x2="512" y2="294" stroke="#c4b5fd" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#darrow)"/>
  <line x1="628" y1="384" x2="512" y2="384" stroke="#c4b5fd" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#darrow)"/>
  <line x1="628" y1="474" x2="512" y2="474" stroke="#c4b5fd" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#darrow)"/>
</svg>
