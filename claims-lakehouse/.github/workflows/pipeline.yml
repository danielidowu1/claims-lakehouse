name: Pipeline

# Runs the medallion pipeline on a schedule or manually.
# Uses AWS OIDC (no long-lived access keys stored in GitHub).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Configure this after creating an IAM role that trusts GitHub's OIDC provider.
      # Docs: https://docs.github.com/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Bronze
        run: python -m src.bronze.ingest
      - name: Silver
        run: python -m src.silver.transform
      - name: Gold
        run: python -m src.gold.model
